plugins {
    id 'com.android.application'
}

// 签名凭证：根目录 keystore.properties（已在 .gitignore 排除）
def ksProps = new Properties()
def ksPropsFile = rootProject.file('../keystore.properties')
if (ksPropsFile.exists()) {
    ksPropsFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.xinghui.learninghub'
    compileSdk 34

    defaultConfig {
        applicationId "com.xinghui.mechqbank"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            // 凭证来自根目录 keystore.properties（不进仓库）
            if (ksProps['storeFile']) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksProps['storeFile']) signingConfig signingConfigs.release
        }
        debug {
            if (ksProps['storeFile']) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
